<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>navigation browser test</title>
  <style>
    body { margin: 0; padding: 40px; }
    ax-navigation { margin-bottom: 30px; }
    .custom-color { --navigation-indicator-color: red; }
    .custom-width { --navigation-indicator-width: 6px; }
    .custom-speed { --navigation-indicator-speed: 100ms; }
    /* A feature is shaped over the progress of its own end, so it is gone when that end
       arrives. The shape is read every frame, with no animation of a custom property. */
    .animated-shape {
      --navigation-indicator-speed: 600ms;
      --ax-edge-right-kind: triangle;
      --ax-edge-right-span: 100%;
      --ax-edge-left-kind: triangle;
      --ax-edge-left-span: 100%;
      /* Full depth over the middle of each end, tapering at both ends. */
      --lead: min(var(--navigation-indicator-lead, 0) * 2.5, 1, (1 - var(--navigation-indicator-lead, 0)) * 2.5);
      --trail: min(var(--navigation-indicator-trail, 0) * 2.5, 1, (1 - var(--navigation-indicator-trail, 0)) * 2.5);
      --ax-edge-right-depth: calc(var(--lead) * 9px);
      --ax-edge-left-depth: calc(var(--trail) * -7px);
    }
    .animated-shape[moving="backward"] {
      --ax-edge-right-depth: calc(var(--trail) * -7px);
      --ax-edge-left-depth: calc(var(--lead) * 9px);
    }
  </style>
</head>
<body>
  <ax-navigation id="nav1">
    <ax-navigation-item id="item1">Home</ax-navigation-item>
    <ax-navigation-item id="item2">Apps</ax-navigation-item>
    <ax-navigation-item id="item3">Games</ax-navigation-item>
  </ax-navigation>

  <ax-navigation id="nav-vertical" vertical class="custom-color custom-width custom-speed">
    <ax-navigation-item id="vitem1" default>First</ax-navigation-item>
    <ax-navigation-item id="vitem2">Second</ax-navigation-item>
  </ax-navigation>

  <script type="module" src="./page.ts"></script>
</body>
</html>
