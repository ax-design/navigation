<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>navigation browser test</title>
  <style>
    body { margin: 0; padding: 40px; }
    ax-navigation { margin-bottom: 30px; }
    .custom-color { --navigation-indicator-color: red; }
    .custom-width { --navigation-indicator-width: 6px; }
    .custom-speed { --navigation-indicator-speed: 100ms; }
    /* A shape animation that runs on the moving mark for as long as the movement lasts. */
    .animated-shape {
      --ax-edge-right-kind: triangle;
      --ax-edge-right-span: 100%;
      --ax-edge-left-kind: triangle;
      --ax-edge-left-span: 100%;
    }
    .animated-shape[moving="forward"] { animation: test-sharpen-forward var(--navigation-indicator-speed, 600ms) linear; }
    .animated-shape[moving="backward"] { animation: test-sharpen-backward var(--navigation-indicator-speed, 600ms) linear; }
    @keyframes test-sharpen-forward {
      0% { --ax-edge-right-depth: 0px; --ax-edge-left-depth: 0px; }
      45% { --ax-edge-right-depth: 9px; --ax-edge-left-depth: -7px; }
      100% { --ax-edge-right-depth: 0px; --ax-edge-left-depth: 0px; }
    }
    @keyframes test-sharpen-backward {
      0% { --ax-edge-left-depth: 0px; --ax-edge-right-depth: 0px; }
      45% { --ax-edge-left-depth: 9px; --ax-edge-right-depth: -7px; }
      100% { --ax-edge-left-depth: 0px; --ax-edge-right-depth: 0px; }
    }
  </style>
</head>
<body>
  <ax-navigation id="nav1">
    <ax-navigation-item id="item1">Home</ax-navigation-item>
    <ax-navigation-item id="item2">Apps</ax-navigation-item>
    <ax-navigation-item id="item3">Games</ax-navigation-item>
  </ax-navigation>

  <ax-navigation id="nav-vertical" vertical class="custom-color custom-width custom-speed">
    <ax-navigation-item id="vitem1" default>First</ax-navigation-item>
    <ax-navigation-item id="vitem2">Second</ax-navigation-item>
  </ax-navigation>

  <script type="module" src="./page.ts"></script>
</body>
</html>
