<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>navigation browser test</title>
  <style>
    body { margin: 0; padding: 40px; }
    ax-navigation { margin-bottom: 30px; }
    .custom-color { --navigation-indicator-color: red; }
    .custom-width { --navigation-indicator-width: 6px; }
    .custom-speed { --navigation-indicator-speed: 100ms; }
    /* Each end carries a feature that is gone by the time that end arrives. */
    .animated-shape {
      --navigation-indicator-speed: 600ms;
      --ax-edge-right-kind: triangle;
      --ax-edge-right-span: 100%;
      --ax-edge-left-kind: triangle;
      --ax-edge-left-span: 100%;
    }
    .animated-shape[moving="forward"] {
      animation: test-point-forward var(--navigation-indicator-arrival) linear, test-notch-forward var(--navigation-indicator-follow) linear var(--navigation-indicator-arrival);
    }
    .animated-shape[moving="backward"] {
      animation: test-point-backward var(--navigation-indicator-arrival) linear, test-notch-backward var(--navigation-indicator-follow) linear var(--navigation-indicator-arrival);
    }
    @keyframes test-point-forward { 0% { --ax-edge-right-depth: 0px; } 50% { --ax-edge-right-depth: 9px; } 100% { --ax-edge-right-depth: 0px; } }
    @keyframes test-notch-forward { 0% { --ax-edge-left-depth: 0px; } 50% { --ax-edge-left-depth: -7px; } 100% { --ax-edge-left-depth: 0px; } }
    @keyframes test-point-backward { 0% { --ax-edge-left-depth: 0px; } 50% { --ax-edge-left-depth: 9px; } 100% { --ax-edge-left-depth: 0px; } }
    @keyframes test-notch-backward { 0% { --ax-edge-right-depth: 0px; } 50% { --ax-edge-right-depth: -7px; } 100% { --ax-edge-right-depth: 0px; } }
  </style>
</head>
<body>
  <ax-navigation id="nav1">
    <ax-navigation-item id="item1">Home</ax-navigation-item>
    <ax-navigation-item id="item2">Apps</ax-navigation-item>
    <ax-navigation-item id="item3">Games</ax-navigation-item>
  </ax-navigation>

  <ax-navigation id="nav-vertical" vertical class="custom-color custom-width custom-speed">
    <ax-navigation-item id="vitem1" default>First</ax-navigation-item>
    <ax-navigation-item id="vitem2">Second</ax-navigation-item>
  </ax-navigation>

  <script type="module" src="./page.ts"></script>
</body>
</html>
